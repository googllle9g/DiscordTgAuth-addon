# DiscordTgAuth - русские сообщения.
# Игровые сообщения используют цвета через &, раздел "bot" отправляется в Discord (разметка Discord).
# Плейсхолдеры: %code% %channel% %seconds% %player% %ip% %limit%
# (Выбор Telegram/Discord, ванильное окно и сообщения о входе — в языковых файлах самого TgAuth.)

choose:
  label: "&9&l[Discord]"
  hover: "&7Привязать через Discord"

discord:
  title: "&9&lПривязка через Discord"
  instructions:
    - "&e1. Зайдите в Дискорд сервера."
    - "&e2. Откройте канал &f#%channel%&e и нажмите &f«Привязать»&e."
    - "&e3. Бот пришлёт вам сообщение в личные сообщения."
    - "&e4. Пришлите боту этот код: &a&l%code%"
  open-button: "&9&n[Войти в Дискорд сервера]"
  open-hover: "&7Открыть приглашение в Discord"
  reminder: "&7Дискорд: нажмите «Привязать» в #%channel% и пришлите боту код &a%code%&7."

copy:
  hover: "&7Нажмите, чтобы скопировать"

login:
  dm-failed: "&cНе удалось написать вам в личные сообщения Discord. Разрешите ЛС от участников сервера и перезайдите."

bot:
  panel: "**Привязка игрового аккаунта**\nСначала зайдите на сервер Minecraft и выберите Discord, затем нажмите кнопку ниже."
  panel-button: "Привязать"
  wrong-server: "Эта кнопка работает только на нашем сервере."
  dm-prompt: "Пришлите мне здесь код, который показан вам в игре (6 цифр)."
  dm-sent: "📩 Я написал вам в личные сообщения — пришлите мне там код из игры."
  dm-closed: "Не могу написать вам в личные сообщения. Разрешите ЛС от участников сервера и нажмите кнопку ещё раз."
  need-button: "Сначала нажмите кнопку «Привязать» в канале #%channel% на сервере."
  bad-code: "❌ Неверный или просроченный код. Зайдите в игру и проверьте код."
  too-many: "⛔ Слишком много неверных попыток. Повторите через %seconds% с."
  limit: "❌ К вашему Discord уже привязано максимальное число аккаунтов: %limit%."
  player-gone: "❌ Игрок уже вышел с сервера. Зайдите в игру и повторите."
  linked: "✅ Аккаунт **%player%** привязан. Вы вошли на сервер."
  confirm: "🔐 Вход на сервер под ником **%player%** (IP %ip%). Это вы?"
  confirm-yes: "✅ Это я"
  confirm-no: "❌ Не я"
  confirmed: "✅ Вход подтверждён."
  rejected: "❌ Вход отклонён, игрок отключён."
  expired: "⌛ Запрос устарел. Зайдите на сервер заново."
  not-yours: "Эта кнопка не для вас."
  error: "❌ Не удалось сохранить привязку. Попробуйте позже."

