# DiscordTgAuth - English messages.
# In-game messages use & colour codes; "bot" messages are sent in Discord (Discord markdown).
# Placeholders: %code% %channel% %seconds% %player% %ip% %limit%
# (The Telegram/Discord choice, the dialog window and the login messages are TgAuth's own lang files.)

choose:
  label: "&9&l[Discord]"
  hover: "&7Link with Discord"

discord:
  title: "&9&lLink with Discord"
  instructions:
    - "&e1. Join the server's Discord."
    - "&e2. Open the channel &f#%channel%&e and press &f\"Link\"&e."
    - "&e3. The bot will send you a direct message."
    - "&e4. Send the bot this code: &a&l%code%"
  open-button: "&9&n[Join the Discord server]"
  open-hover: "&7Open the Discord invite"
  reminder: "&7Discord: press \"Link\" in #%channel% and send the bot the code &a%code%&7."

copy:
  hover: "&7Click to copy"

login:
  dm-failed: "&cCould not send you a Discord direct message. Allow DMs from server members and rejoin."

bot:
  panel: "**Link your game account**\nFirst join the Minecraft server and choose Discord, then press the button below."
  panel-button: "Link"
  wrong-server: "This button only works on our server."
  dm-prompt: "Send me the code that is shown in the game here (6 digits)."
  dm-sent: "📩 I sent you a direct message - send me the in-game code there."
  dm-closed: "I can't send you a direct message. Allow DMs from server members and press the button again."
  need-button: "First press the \"Link\" button in the #%channel% channel on the server."
  bad-code: "❌ Wrong or expired code. Check the code in the game."
  too-many: "⛔ Too many wrong attempts. Try again in %seconds% s."
  limit: "❌ Your Discord account already has the maximum number of linked accounts: %limit%."
  player-gone: "❌ The player has already left the server. Join the game and try again."
  linked: "✅ Account **%player%** linked. You are logged in."
  confirm: "🔐 Login to the server as **%player%** (IP %ip%). Is this you?"
  confirm-yes: "✅ It's me"
  confirm-no: "❌ Not me"
  confirmed: "✅ Login confirmed."
  rejected: "❌ Login rejected, the player was disconnected."
  expired: "⌛ This request has expired. Join the server again."
  not-yours: "This button is not for you."
  error: "❌ Something went wrong while saving the link. Try again later."

